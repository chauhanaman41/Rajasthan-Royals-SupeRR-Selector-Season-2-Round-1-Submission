<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad_27" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00205B" />
      <stop offset="100%" stop-color="#FFB81C" />
    </linearGradient>
    <filter id="glow_27" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00205B" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Outer Shield Shape -->
  <path d="M 60,10 L 105,25 L 105,65 C 105,92 60,112 60,112 C 60,112 15,92 15,65 L 15,25 Z"
        fill="url(#shieldGrad_27)" stroke="#38BDF8" stroke-width="3" filter="url(#glow_27)" />
  <!-- Inner Ring -->
  <circle cx="60" cy="58" r="32" fill="#FFB81C" fill-opacity="0.75" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,2" />
  <!-- Crossed Cricket Bats Silhouette -->
  <line x1="42" y1="76" x2="78" y2="40" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <line x1="78" y1="76" x2="42" y2="40" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <!-- Team Initials Monogram -->
  <text x="60" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    SL
  </text>
  <!-- Top Star Accent -->
  <polygon points="60,20 63,27 70,27 65,32 67,39 60,35 53,39 55,32 50,27 57,27" fill="#FFD700" />
